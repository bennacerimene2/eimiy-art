
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éimiy Art | Handmade with Love</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
      background: #fffaf7;
      color: #59443f;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 8%;
      background: #f5e8e4;
    }

    .logo {
      font-size: 30px;
      color: #a66b78;
      font-weight: bold;
    }

    nav a {
      text-decoration: none;
      color: #59443f;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 75px);
      color: #a66b78;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.8;
      max-width: 550px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #b77b87;
      color: white;
      padding: 14px 32px;
      border-radius: 30px;
      text-decoration: none;
    }

    .about {
      text-align: center;
      padding: 65px 20px;
      background: #f5e8e4;
    }

    .about h2 {
      color: #a66b78;
      font-size: 32px;
      margin-bottom: 20px;
    }

    footer {
      text-align: center;
      padding: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Éimiy Art</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#shop">Shop</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>Art made with love</h1>
    <p>
      Discover beautiful handmade paintings
      and unique pieces created just for you.
    </p>
    <a href="#shop" class="btn">Explore Collection</a>
  </section>

  <section class="about" id="about">
    <h2>A little piece of art</h2>
    <p>
      Every painting tells a story.
      Let your walls tell yours.
    </p>
  </section>

  <footer>
    © 2026 Éimiy Art. All rights reserved.
  </footer>

</body>
</html>
